<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Course Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <header class="dashboard-header">
        <h1>Course Dashboard</h1>
        <a href="#courses" class="header-link">강의 목록</a>
    </header>

    <main class="container">

        <section id="courses">
            <h2>Frontend Web Course</h2>
            <p>나의 프론트엔드 학습 현황</p>

            <div class="course-grid">

                <article class="course-card">
                    <h3>HTML 기본</h3>
                    <p class="status completed">완료</p>
                </article>

                <article class="course-card">
                    <h3>CSS 선택자</h3>
                    <p class="status completed">완료</p>
                </article>

                <article class="course-card">
                    <h3>CSS Box Model</h3>
                    <p class="status completed">완료</p>
                </article>

                <article class="course-card">
                    <h3>Flexbox와 Grid</h3>
                    <p class="status completed">완료</p>
                </article>

                <article class="course-card">
                    <h3>반응형 웹</h3>
                    <p class="status in-progress">진행 중</p>
                </article>

                <article class="course-card">
                    <h3>JavaScript 기초</h3>
                    <p class="status planned">시작 전</p>
                </article>

            </div>
        </section>

    </main>

</body>
</html>
