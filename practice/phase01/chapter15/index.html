
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1>Member Management</h1>
    </header>

    <main class="container">
        <section class="member-section">
            <div class="panel">
                <h2>회원 목록</h2>
                <div id="status"></div>
                <div id="member-list"></div>
            </div>

            <div class="panel">
                <h2>회원 상세</h2>
                <div id="member-detail">회원을 선택하세요.</div>
            </div>
        </section>

        <section class="panel">
            <h2>회원 등록</h2>

            <form id="member-form">
                <input
                    name="name"
                    placeholder="이름"
                    required
                >

                <input
                    name="email"
                    type="email"
                    placeholder="이메일"
                    required
                >

                <button type="submit">등록 요청</button>
            </form>

            <p id="form-message"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
