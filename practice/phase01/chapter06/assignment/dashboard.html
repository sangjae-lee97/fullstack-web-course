<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- 1. Header -->
    <header class="site-header">
        <h1>Member Dashboard</h1>

        <nav class="main-nav">
            <a href="#">Home</a>
            <a href="#members">Members</a>
        </nav>
    </header>

    <main class="container">

        <!-- 2. 검색 영역 -->
        <section class="toolbar">
            <input type="search" placeholder="회원 이름 검색">
            <button type="button">검색</button>
            <button type="button">회원 추가</button>
        </section>

        <!-- 3. 회원 카드 영역 -->
        <section id="members">
            <h2>회원 목록</h2>

            <div class="member-grid">

                <article class="member-card">
                    <h3>홍길동</h3>
                    <p>hong@example.com</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

                <article class="member-card">
                    <h3>김영희</h3>
                    <p>kim@example.com</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

                <article class="member-card">
                    <h3>이철수</h3>
                    <p>lee@example.com</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

                <article class="member-card">
                    <h3>박민수</h3>
                    <p>park@example.com</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

                <article class="member-card">
                    <h3>최지은</h3>
                    <p>choi@example.com</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

                <article class="member-card">
                    <h3>정우진</h3>
                    <p>jung@example.com</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

            </div>
        </section>

    </main>

</body>
</html>
