<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model 실습</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1>Member Management</h1>
        <nav class="main-nav">
            <a href="#">Home</a>
            <a href="#members">Members</a>
            <a href="#member-form">Add Member</a>
        </nav>
    </header>

    <main class="container">

        <!-- 회원 목록 영역 -->
        <section class="card" id="members">
            <h2>회원 목록</h2>

            <div class="toolbar">
                <input type="search" placeholder="회원 이름 검색">
                <button type="button">검색</button>
                <button type="button">회원 추가</button>
            </div>

            <!-- 기존 회원 테이블 -->
            <table>
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>홍길동</td>
                        <td>hong@example.com</td>
                    </tr>
                    <tr>
                        <td>김철수</td>
                        <td>kim@example.com</td>
                    </tr>
                </tbody>
            </table>

            <!-- STEP 04: 회원 카드 추가 -->
            <div class="member-grid">

                <article class="member-card">
                    <h3>홍길동</h3>
                    <p>hong@example.com</p>
                    <p>Frontend Basic</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

                <article class="member-card">
                    <h3>김영희</h3>
                    <p>kim@example.com</p>
                    <p>Frontend Basic</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

                <article class="member-card">
                    <h3>이철수</h3>
                    <p>lee@example.com</p>
                    <p>Frontend Basic</p>
                    <div class="card-actions">
                        <button type="button">상세</button>
                        <button type="button">수정</button>
                    </div>
                </article>

            </div>

        </section>

        <!-- 회원 등록 영역 -->
        <section class="card" id="member-form">
            <h2>회원 등록</h2>

            <form>
                <label for="name">이름</label>
                <input type="text" id="name" name="name">

                <label for="email">이메일</label>
                <input type="email" id="email" name="email">

                <button type="button">등록</button>
                <a class="button-link" href="#member-form">회원 등록</a>
            </form>
        </section>

    </main>
</body>
</html>
